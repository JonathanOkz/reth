[package]
name = "reth-cli-commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]

[dependencies]
# reth
# Keep the patched command crate source-compatible with downstream projects that use the official
# v2.2.0 graph. This avoids loading a second, type-incompatible copy of every Reth crate.
reth-chainspec = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0", default-features = false }
reth-cli = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-cli-runner = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-cli-util = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-codecs.workspace = true
reth-config = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0", default-features = false, features = ["serde"] }
reth-consensus = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0", default-features = false }
reth-db = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0", default-features = false, features = ["mdbx"] }
reth-db-api = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-db-common = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-downloaders = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0", features = ["file-client"] }
reth-ecies = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-eth-wire = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-era = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-era-downloader = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-era-utils = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-etl = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-evm = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0", default-features = false }
reth-exex = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-fs-util = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-net-nat = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-network = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0", features = ["serde"] }
reth-network-p2p = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-network-peers = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0", default-features = false, features = ["secp256k1"] }
reth-node-api = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-node-builder = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-node-core = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-node-events = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-node-metrics = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0", default-features = false, optional = true }
reth-provider = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-prune = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-prune-types = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0", default-features = false }
reth-revm = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0", default-features = false }
reth-stages = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-stages-types = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0", default-features = false }
reth-static-file-types = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0", default-features = false, features = ["clap"] }
reth-static-file = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-tasks = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-storage-api = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0", default-features = false }
reth-trie = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0", features = ["metrics"] }
reth-trie-db = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0", features = ["metrics"] }
reth-trie-common = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0", default-features = false, optional = true }
reth-primitives-traits.workspace = true
reth-discv4 = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }
reth-discv5 = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0" }

# ethereum
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-consensus.workspace = true
alloy-chains.workspace = true

itertools.workspace = true
futures.workspace = true
tokio.workspace = true

# misc
humantime.workspace = true
human_bytes.workspace = true
eyre.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
lz4.workspace = true
zstd.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
tar.workspace = true
tracing.workspace = true
backon.workspace = true
secp256k1 = { workspace = true, features = ["global-context", "std", "recovery"] }
tokio-stream.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
url.workspace = true
metrics.workspace = true
blake3.workspace = true
rayon.workspace = true

# io
fdlimit.workspace = true
toml = { workspace = true, features = ["display"] }

# tui
comfy-table.workspace = true
crossterm.workspace = true
ratatui = { workspace = true, features = ["crossterm"] }

# reth test-vectors
proptest = { workspace = true, optional = true }
arbitrary = { workspace = true, optional = true }
proptest-arbitrary-interop = { workspace = true, optional = true }

[dev-dependencies]
reth-ethereum-cli = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0", default-features = false }
reth-provider = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.2.0", features = ["test-utils"] }
tempfile.workspace = true

[features]
arbitrary = [
    "dep:proptest",
    "dep:arbitrary",
    "dep:proptest-arbitrary-interop",
    "dep:reth-trie-common",
    "reth-db-api/arbitrary",
    "reth-eth-wire/arbitrary",
    "reth-db/arbitrary",
    "reth-chainspec/arbitrary",
    "alloy-chains/arbitrary",
    "alloy-eips/arbitrary",
    "alloy-primitives/arbitrary",
    "reth-codecs/test-utils",
    "reth-prune-types/test-utils",
    "reth-stages-types/test-utils",
    "reth-trie-common?/test-utils",
    "reth-codecs/arbitrary",
    "reth-prune-types/arbitrary",
    "reth-stages-types/arbitrary",
    "reth-trie-common?/arbitrary",
    "alloy-consensus/arbitrary",
    "reth-primitives-traits/arbitrary",
    "reth-ethereum-primitives/arbitrary",
]
